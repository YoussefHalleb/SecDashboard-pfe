name: Build & Push to GCR

on:
  push:
    branches: [main]

env:
  PROJECT_ID: secdashboard-pfe
  GITOPS_REPO: YoussefHalleb/SecDashboard-gitops

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for GCR
        run: gcloud auth configure-docker --quiet

      - name: Build & Push Backend
        run: |
          docker build -t gcr.io/$PROJECT_ID/backend:${{ github.sha }} \
                       -t gcr.io/$PROJECT_ID/backend:latest \
                       ./backend
          docker push gcr.io/$PROJECT_ID/backend:${{ github.sha }}
          docker push gcr.io/$PROJECT_ID/backend:latest

      - name: Build & Push Frontend
        run: |
          docker build -t gcr.io/$PROJECT_ID/frontend:${{ github.sha }} \
                       -t gcr.io/$PROJECT_ID/frontend:latest \
                       ./security-dashboard
          docker push gcr.io/$PROJECT_ID/frontend:${{ github.sha }}
          docker push gcr.io/$PROJECT_ID/frontend:latest

      - name: Push Postgres image
        run: |
          docker pull postgres:15-alpine
          docker tag postgres:15-alpine gcr.io/$PROJECT_ID/postgres:latest
          docker push gcr.io/$PROJECT_ID/postgres:latest

      - name: Checkout GitOps repo
        uses: actions/checkout@v4
        with:
          repository: ${{ env.GITOPS_REPO }}
          token: ${{ secrets.GITOPS_TOKEN }}
          path: gitops
          fetch-depth: 0

      - name: Update image tags in GitOps repo
        run: |
          sed -i "s|gcr.io/$PROJECT_ID/backend:.*|gcr.io/$PROJECT_ID/backend:${{ github.sha }}|g" gitops/k8s/backend-deployment.yaml
          sed -i "s|gcr.io/$PROJECT_ID/frontend:.*|gcr.io/$PROJECT_ID/frontend:${{ github.sha }}|g" gitops/k8s/frontend-deployment.yaml

      - name: Commit and push GitOps changes
        run: |
          cd gitops
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add k8s/backend-deployment.yaml k8s/frontend-deployment.yaml
          git diff --cached --quiet || git commit -m "Update images to ${{ github.sha }}"
          git push
